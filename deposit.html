<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deposit</title>
<link rel="stylesheet" href="style.CSS">
</head>
<body>

<div class="topbar">
    <div class="logo">GASHA.BET</div>
</div>

<div class="level-card">

    <h2>Deposit Funds</h2>

    <input type="number" id="amount" placeholder="Enter Amount">

    <br><br>

    <button onclick="depositMoney()">
    Deposit Now
</button>
    </button>

    <p id="msg"></p>

</div>

<script>
function depositMoney() {

    let amount = Number(document.getElementById("amount").value);

    if(amount <= 0){
      let history = localStorage.getItem("history") || "";
history += "<li>Deposit: " + amount + " ETB</li>";
localStorage.setItem("history", history);
        document.getElementById("msg").innerHTML =
        "Enter a valid amount";
        return;
    }

    let balance = Number(localStorage.getItem("balance")) || 0;
    balance += amount;
localStorage.setItem("balance", balance);
let history = localStorage.getItem("history") || "";
history += "<li>Deposit: " + amount + " ETB</li>";
localStorage.setItem("history", history);
let notes = localStorage.getItem("notifications") || "";
notes += "<p>💰 Deposit: " + amount + " ETB</p>";
localStorage.setItem("notifications", notes);

document.getElementById("msg").innerHTML =
"Deposit Successful: " + amount + " ETB";
let points = Number(localStorage.getItem("points")) || 0;
points += Number(amount);

localStorage.setItem("points", points);
}
</script>

</body>
</html>
